name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Restore Dependencies
        run: dotnet restore PhysicsVisualiser.slnx

      - name: Build Solution
        run: dotnet build PhysicsVisualiser.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test PhysicsSolver.Tests/PhysicsSolver.Tests.csproj -c Release --no-build --verbosity normal
