name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Build Windows App
        run: dotnet build PhysicsVisualiser/PhysicsVisualiser.csproj -f net10.0-windows10.0.19041.0 -c Release

      - name: Run Unit Tests
        run: dotnet test PhysicsSolver.Tests/PhysicsSolver.Tests.csproj -c Release --verbosity normal
